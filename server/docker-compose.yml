services:
  postgres:
    image: postgres:16-alpine
    container_name: bimaverse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bimaverse}
      POSTGRES_USER: ${POSTGRES_USER:-bimaverse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bimaverse_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bimaverse_user} -d ${POSTGRES_DB:-bimaverse}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
